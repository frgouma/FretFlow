function chordUsages(code){const found=[];for(const tab of projectData.nativeTabs||[])for(const section of tab.sections||[]){if(section.type==='chordgrid'&&(section.chords||[]).includes(code))found.push(tab.title);if(['chordsection','songsection'].includes(section.type))for(const line of section.lines||[])for(const measure of line.measures||[])if((measure.chords||[]).includes(code))found.push(tab.title)}return [...new Set(found)]}
function replaceChordCode(oldCode,newCode){for(const tab of projectData.nativeTabs||[])for(const section of tab.sections||[]){if(section.type==='chordgrid')section.chords=(section.chords||[]).map(code=>code===oldCode?newCode:code);if(['chordsection','songsection'].includes(section.type))for(const line of section.lines||[])for(const measure of line.measures||[])measure.chords=(measure.chords||[]).map(code=>code===oldCode?newCode:code)}}
function saveChord(){const code=String(draftChord.code||'').trim();if(!code){alert('Vul een akkoordcode in.');return}const library=chordLibrary(),existing=library.find(chord=>chord.code===code);if(existing&&code!==currentChordCode&&!confirm(`Akkoord ${code} bestaat al. Overschrijven?`))return;const entry=structuredClone(draftChord);entry.code=code;entry.category=entry.category||chordCategories()[0]?.id||'';entry.diagram=entry.diagram||emptyChord().diagram;entry.diagram.startFret=Math.max(1,Number(entry.diagram.startFret)||1);entry.diagram.frets=(entry.diagram.frets||[]).slice(0,6);while(entry.diagram.frets.length<6)entry.diagram.frets.push('x');entry.diagram.fingers=(entry.diagram.fingers||[]).slice(0,6);while(entry.diagram.fingers.length<6)entry.diagram.fingers.push(null);if(!(entry.diagram.barres||[]).length)delete entry.diagram.barres;const originalIndex=currentChordCode?library.findIndex(chord=>chord.code===currentChordCode):-1;if(currentChordCode&&currentChordCode!==code)replaceChordCode(currentChordCode,code);const filtered=library.filter(chord=>chord.code!==currentChordCode&&chord.code!==code),insertAt=originalIndex<0?filtered.length:Math.min(originalIndex,filtered.length);filtered.splice(insertAt,0,entry);projectData.chords.chords=filtered;currentChordCode=code;draftChord=structuredClone(entry);chordLibraryMessage=`${code} opgeslagen.`;render()}
function deleteChord(){if(!currentChordCode)return;const uses=chordUsages(currentChordCode),detail=uses.length?`\nWordt gebruikt in: ${uses.join(', ')}. Verwijzingen worden ook verwijderd.`:'';if(!confirm(`Akkoord ${currentChordCode} verwijderen?${detail}`))return;projectData.chords.chords=chordLibrary().filter(chord=>chord.code!==currentChordCode);for(const tab of projectData.nativeTabs||[])for(const section of tab.sections||[]){if(section.type==='chordgrid')section.chords=(section.chords||[]).filter(code=>code!==currentChordCode);if(['chordsection','songsection'].includes(section.type))for(const line of section.lines||[])for(const measure of line.measures||[])measure.chords=(measure.chords||[]).filter(code=>code!==currentChordCode)}currentChordCode='';draftChord=emptyChord();chordLibraryMessage='Akkoord verwijderd.';render()}
function defaultRecordGroups(){return[]}
function newNative(){draftRecord={id:'',kind:'native',title:'',artist:'',groups:defaultRecordGroups(),tuning:'Standard',tags:['native'],description:'',footer:'',sections:[]};current='__new__';render();requestAnimationFrame(()=>metaTitle?.focus())}function newPdf(){const base='nieuwe-pdf',existing=new Set(projectData.pdfTabs.map(r=>r.id));let id=base,n=2;while(existing.has(id))id=`${base}-${n++}`;const r={id,embeddedId:`${id}-base64`,kind:'pdf',title:'Nieuwe PDF',artist:'',groups:defaultRecordGroups(),tags:['pdf'],description:'',footer:'',pageCount:1,data:'',fileName:''};projectData.pdfTabs.push(r);select(r.id)}async function readPdf(f){if(!f)return;const pending=preserveRecordMetadataForm(),r=get(),buf=await f.arrayBuffer(),bytes=new Uint8Array(buf);let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000));r.data=btoa(bin);r.fileName=f.name||r.fileName||'';render();restoreRecordMetadataForm(pending)}
/* =============================================================================
   BUILDER PROJECT WORKFLOW
   - builder.html is the source of all HTML/CSS/JS and data templates.
   - FretFlow.html contains one integrated project JSON object.
   - Opening an integrated FretFlow project loads only project data; the active code uses the current 10B project schema with the 10E Builder workflow.
   ============================================================================= */
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportStandalone({appBody, js, css, projectData}) {
  const projectCopy = FretFlow.normalizeProjectModel(projectData);
  const safeJson = value => JSON.stringify(value, null, 2).replace(/<\/script/gi, "<\\/script");
  const safeScript = String(js || "").replace(/<\/script/gi, "<\\/script");
  const pageTitle = FretFlow.escape(projectCopy.project.title || "FretFlow");
  return `<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${pageTitle}</title>

<!-- =======================================================================
     FRETFLOW APP CSS — readable component rules from builder.html
     ======================================================================= -->
<style id="fretflow-app-css">
${css}
</style>
</head>
<body>
<!-- =======================================================================
     FRETFLOW APP SHELL — HomeView and ViewerView
     ======================================================================= -->
${appBody}

<!-- =======================================================================
     FRETFLOW PROJECT DATA — one integrated JSON project object
     ======================================================================= -->
<script id="fretflow-project-json" type="application/json">${safeJson(projectCopy)}<\/script>

<!-- PDF.js is the only external runtime dependency. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"><\/script>

<!-- =======================================================================
     FRETFLOW RUNTIME — named renderers and component classes
     ======================================================================= -->
<script id="fretflow-runtime">
${safeScript}
<\/script>
</body>
</html>`;
};


function normalizeTabSections(d){for(const record of d.tabs||[]){for(const section of record.sections||[]){if(section.type!=='tabsection')continue;if(!section.lines&&section.measures)section.lines=[{measures:section.measures}];section.lines=section.lines||[];for(const line of section.lines){line.measures=(line.measures||[]).map(m=>{m.notes=(m.notes||[]).map(n=>({position:n.position??(n.relX!=null?`${Math.round(n.relX*100)}%`:(n.pos!=null?String(Math.max(1,Math.min(16,n.pos+1))):'1')),string:(n.position==null&&(n.relX!=null||n.pos!=null)?Number(n.string||0)+1:Number(n.string||1)),fret:n.fret??'0',type:n.type||'standard',...(n.ghost?{ghost:true}:{})}));delete m.grid;delete m.width;delete m.pickup;return m});}delete section.measures;}}return d}
function normalizeCurrentProject(data){const prepared=FretFlow.normalizeProjectModel(structuredClone(data));const nativeLike=normalizeTabSections({tabs:prepared.nativeTabs});prepared.nativeTabs=nativeLike.tabs;for(const record of prepared.nativeTabs)for(const section of record.sections||[])if(section.type==='simpleriff')ensureSimpleRiffLines(section);return FretFlow.normalizeProjectModel(prepared)}
function deleteCurrent(){if(!get()||!confirm('Tab verwijderen?'))return;const target=records();const index=target.findIndex(r=>r.id===current);if(index>=0)target.splice(index,1);current=null;render()}
function appSource(id){const node=document.getElementById(id);if(!node)throw new Error(`Interne Builder-bron ontbreekt: ${id}`);return node.textContent}
function buildStandalone(){if(!projectData)throw new Error('Open eerst een gitaarmap of maak een nieuwe.');projectData=normalizeCurrentProject(projectData);return exportStandalone({appBody:document.getElementById('fretflow-app-shell-template').innerHTML.trim(),js:appSource('fretflow-runtime'),css:appSource('fretflow-app-css'),projectData})}
function buildAndDownload(){downloadBlob(new Blob([buildStandalone()],{type:'text/html'}),'FretFlow.html');rememberProjectBaseline()}
function jsonFromNode(doc,id){const node=doc.getElementById(id);if(!node)return null;return JSON.parse(node.textContent)}
const CURRENT_SCHEMA=FretFlow.CURRENT_SCHEMA;
function projectSchema(raw){return String(raw?.schemaVersion||'').trim()}
function assertSupportedSchema(raw){
  const schema=projectSchema(raw);
  if(!schema)throw new Error('Deze gitaarmap bevat geen herkenbare schemaVersion.');
  if(schema!==CURRENT_SCHEMA)throw new Error(`Deze gitaarmap gebruikt schema ${schema}. Builder 10E ondersteunt schema ${CURRENT_SCHEMA}. Open een nieuwer schema met een nieuwere FretFlow Builder.`);
}
function migrateProjectToCurrent(raw){
  assertSupportedSchema(raw);
  return structuredClone(raw);
}
function loadProject(raw){
  return normalizeCurrentProject(migrateProjectToCurrent(raw));
}
function readProjectFromStandalone(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const current=jsonFromNode(doc,'fretflow-project-json');
  if(!current)throw new Error('Geen geïntegreerde FretFlow-projectdata gevonden.');
  return loadProject(current);
}
function setProject(data,kind='project'){projectData=loadProject(data);projectMetadataSaved=false;recordMetadataSavedKey='';activateDataset(kind);rememberProjectBaseline()}
function createNewProject(){if(!confirmReplaceCurrentProject('Nieuwe gitaarmap starten?'))return;setProject(FretFlow.createEmptyProject(),'project')}
async function openStandaloneFile(file){const loaded=readProjectFromStandalone(await file.text());setProject(loaded,'project')}

/* =============================================================================
   BUILDER UI BINDINGS
   ============================================================================= */
recordSearch.oninput=()=>list();
recordSelect.onchange=()=>{const next=recordSelect.value;if(!next)return;if(!confirmDiscardUnsavedMetadata()){recordSelect.value=current||'';return}select(next)};
datasetKind.onchange=()=>{const next=datasetKind.value;if(!confirmDiscardUnsavedMetadata()){datasetKind.value=activeKind;return}activateDataset(next)};
newProject.onclick=()=>createNewProject();
openApp.onclick=()=>{if(!confirmReplaceCurrentProject('Een andere gitaarmap openen?'))return;standaloneFile.value='';standaloneFile.click()};
standaloneFile.onchange=async e=>{try{const file=e.target.files[0];if(file)await openStandaloneFile(file)}catch(err){alert(`Openen mislukt: ${err.message}`)}finally{e.target.value=''}};
buildApp.onclick=()=>{if(!confirmDiscardUnsavedMetadata())return;try{buildAndDownload()}catch(err){alert(`Opslaan mislukt: ${err.message}`)}};
// Buttons inside editor/library can rerender or navigate; protect unsaved metadata first.
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(['metadataSave','projectMetadataSave','createTab'].includes(button.id))return;if(!(editor.contains(button)||libraryActions.contains(button)))return;if(!confirmDiscardUnsavedMetadata()){event.preventDefault();event.stopImmediatePropagation()}},true);
document.addEventListener('input',event=>resetSavedMetadataState(event.target));
document.addEventListener('change',event=>resetSavedMetadataState(event.target));
window.addEventListener('beforeunload',event=>{if(!hasUnsavedMetadata()&&!hasProjectChanges())return;event.preventDefault();event.returnValue=''});
render();

</script>
