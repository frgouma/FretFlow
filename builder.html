gin:0 0 10px;font-size:22px;color:#20170f} .card p{margin:0;line-height:1.4;color:#5d5146;font-size:14px} .hint{margin-top:22px;text-align:center;color:#6f6256;font-size:13px} .viewer{display:none;min-height:100vh;background:linear-gradient(135deg,#e6ddcf,#cfc5b8)} .topbar{position:sticky;top:0;z-index:5;height:58px;background:#20170ff5;color:white;display:flex;align-items:center;gap:12px;padding:0 16px;box-shadow:0 4px 18px #00000038} .back,.navbtn{border:1px solid #ffffff38;background:#ffffff14;color:white;border-radius:10px;padding:9px 12px;cursor:pointer} .navbtn:disabled{opacity:.35;cursor:not-allowed} .spacer{flex:1} .count{font-size:14px;color:#eee} #viewerTitle{font-size:clamp(15px,2.25vw,18px);line-height:1.12;min-width:0;} .frame-wrap{padding:26px;overflow-x:auto} .page{width:794px;height:1123px;min-height:1123px;margin:0 auto 32px;background:#fff;box-shadow:0 18px 48px #32261a47;position:relative;padding:32px 0 40px;overflow:hidden} .page-header{height:60px;margin:0 60px 0;overflow:hidden} .ptitle{font-size:23px;margin:0 0 2px;font-weight:700} .psub{font-size:12px;margin:0 0 6px} .page-subtitle{font-size:11px;margin:0;color:#555} .section{margin-left:42px;margin-bottom:0} h2{font-size:14px;margin:0 0 6px} .sep{height:1px;background:#444;margin:12px 60px} .board{display:grid;grid-template-columns:60px 520px 130px;grid-template-rows:17px repeat(6,16px);align-items:center;font-size:10px} .board.nocoach{grid-template-columns:60px 520px} .fl{grid-column:1;grid-row:1;text-align:right;padding-right:8px} .fr{grid-column:2;grid-row:1;display:grid;grid-template-columns:repeat(17,1fr);background:#f2f2f2;border:1px solid #444;border-bottom:0;height:17px;align-items:center;text-align:center;font-weight:700} .fr span,.sg>div{border-left:1px solid #b8b8b8;height:100%} .fr span{display:flex;align-items:center;justify-content:center} .fr span:first-child,.sg>div:nth-child(17n+1){border-left:0} .sl{grid-column:1;text-align:right;padding-right:8px;font-size:10px} .sg{grid-column:2;display:grid;grid-template-columns:repeat(17,1fr);height:16px;border-left:1px solid #444;border-right:1px solid #444;border-top:1px solid #b8b8b8;position:relative} .sg.last{border-bottom:1px solid #444} .note{width:13px;height:13px;border-radius:50%;border:1px solid #555;background:white;color:#111;font-size:8px;font-weight:700;text-align:center;position:absolute;top:50%;transform:translate(-50%,-50%);z-index:2;display:flex;align-items:center;justify-content:center;line-height:1} .root{background:#111;color:white;border-color:#111} .third{background:white;color:#111;border:2px solid #111} .ghost{opacity:.28} .arrow,.slash{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:15px;font-weight:700;color:#111;z-index:1} .coach{grid-column:3;grid-row:1/span 7;font-size:9.2px;line-height:1.25;padding-left:14px} .coach b{display:block;margin-bottom:3px} .practice{margin:0 60px;display:grid;grid-template-columns:1fr 1fr;gap:18px;font-size:10.5px;line-height:1.35} .box{border-top:1px solid #444;padding-top:10px} .box b{display:block;margin-bottom:5px;font-size:12px} .chord-grid{margin:0 60px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px} .chord{text-align:center} .chord-title{font-weight:700;margin-bottom:8px} .chord svg{width:105px;height:140px} .footer{position:absolute;left:60px;right:60px;bottom:36px;font-size:10px} .legend{margin-top:8px;display:flex;gap:28px;align-items:center;flex-wrap:wrap} .li{display:inline-flex;align-items:center;gap:8px} .ld{position:static;transform:none;display:inline-block} @media(max-width:850px){.home{padding:22px 14px}.shell{padding:24px 18px}h1{font-size:38px}.frame-wrap{padding:10px}} @page{size:A4 portrait;margin:0}

.chord-grid{margin:0 60px;display:grid;grid-template-columns:repeat(5,112px);gap:14px;align-items:start}
.chord{width:112px;text-align:center;background:#fff;padding:4px 4px 2px}
.chord-title{font-weight:700;margin-bottom:5px;font-size:13px}
.chord svg{width:96px;height:128px}
.component-block{height:160px;overflow:hidden;position:relative;margin-bottom:0}
.component-title{font-size:14px;font-weight:700;margin:0 60px 6px;color:#1f2933}
.section .component-title{margin-left:0}
.component-note{margin:0 60px 12px;font-size:10.5px;color:#333;line-height:1.35}
.text-component{height:80px;margin:0 60px;overflow:hidden;font-size:11px;line-height:1.35;color:#333}
.text-component-title{font-weight:700;font-size:13px;margin:0 0 5px;color:#1f2933}
.text-component-body{margin:0}.text-component-line{margin:0 0 3px}.text-component-line-title{font-weight:700;color:#1f2933}


.home-mode{margin-top:4px}
.breadcrumb{display:none;align-items:center;gap:8px;margin:0 0 18px;color:#6f6256;font-size:13px}
.crumb-btn{border:0;background:transparent;color:#8f4f1b;font-weight:700;cursor:pointer;padding:0}
.home-back{border:1px solid #ffffff38;background:#20170f;color:white;border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:700}
.category-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.category-card{border:1px solid #5c483029;border-radius:22px;padding:24px;text-align:left;background:linear-gradient(180deg,#ffffffe6,#fff8ebef);cursor:pointer;min-height:166px;box-shadow:0 12px 28px #261c1221;transition:.14s;position:relative;overflow:hidden}
.category-card:after{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:#c47a2c}
.category-card:nth-child(2):after{background:#536d8c}
.category-card:nth-child(3):after{background:#637a4d}
.category-card:hover{transform:translateY(-4px);box-shadow:0 18px 36px #261c1238}
.category-card h2{margin:0 0 10px;font-size:24px;color:#20170f}
.category-card p{margin:0 0 18px;line-height:1.4;color:#5d5146;font-size:14px}
.category-card .count-badge{display:inline-flex;border-radius:999px;background:#221812;color:white;padding:6px 10px;font-size:12px;font-weight:700}
.section-title-home{margin:6px 0 14px;font-size:15px;color:#6f6256;font-weight:700}


.songchart{display:none}
.songchart-title{font-size:14px;font-weight:700;margin:0 0 4px}
.songchart-legend{font-size:10.5px;color:#555;margin:0 0 18px}
.songsection{height:160px;margin:0 60px;position:relative;overflow:visible}
.songsection-head{display:flex;align-items:flex-start;gap:10px;height:24px;margin:0 0 2px}
.songsection-title{font-size:16px;font-weight:700;min-height:18px}
.segno{font-family:"Segoe UI Symbol","Noto Music","DejaVu Sans",serif;font-size:22px;line-height:18px;color:#111}
.segno.double{letter-spacing:2px;margin-right:2px}
.chart-line{display:grid;grid-template-columns:repeat(4,minmax(118px,1fr));align-items:stretch;margin-left:20px;margin-bottom:18px;max-width:610px}
.measure{min-height:44px;border-left:2px solid #111;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700;padding:5px 10px;background:#fff}
.measure:last-of-type{border-right:2px solid #111}
.measure.two-chords{gap:18px;font-size:19px}
.measure .subchord{display:inline-block;min-width:42px;text-align:center}.measure.segno-start::before{content:'𝄋';font-family:'Segoe UI Symbol','Noto Music','DejaVu Sans',serif;font-size:16px;margin-right:6px}
.measure.end-double{border-right:2px solid #111;box-shadow:4px 0 0 -2px #111}
.measure.end-repeat{border-right:2px solid #111}
.measure.end-repeat::after{content:":||";font-size:18px;font-weight:600;margin-left:auto;padding-left:8px;color:#111;letter-spacing:-1px}
.repeat-hooks{grid-column:1/-1;height:14px;display:flex;justify-content:flex-end;align-items:center;font-size:17px;font-weight:500;margin-top:-13px;margin-bottom:2px;max-width:610px}
.repeat-hooks span{display:inline-block;width:34px;text-align:center;color:#111}
.below-right{grid-column:1/-1;text-align:right;max-width:610px;font-size:12px;font-weight:700;color:#444;margin-top:-13px;margin-bottom:2px}
.song-notes{margin:12px 0 0 20px;font-size:10.5px;line-height:1.45;color:#333}
.song-notes li{margin-bottom:3px}


:root{
  --music-font:"Noto Music","Bravura Text","Segoe UI Symbol","DejaVu Sans",serif;
}
.music-symbol,.segno,.unicode-symbol,.unicode-example{
  font-family:var(--music-font);
}
.unicode-playground{margin:0 60px 16px}
.unicode-section-title{font-size:14px;font-weight:700;margin:0 0 12px}
.font-test-grid{display:grid;grid-template-columns:1fr;gap:18px;margin-bottom:20px}
.font-panel{border-top:1px solid #444;padding-top:10px}
.font-panel-title{font-size:12px;font-weight:700;margin-bottom:8px;color:#333}
.symbol-row{display:grid;grid-template-columns:110px 1fr;align-items:center;border-top:1px solid #d0d0d0;min-height:42px}
.symbol-row:last-child{border-bottom:1px solid #d0d0d0}
.symbol-label{font-size:11px;font-weight:700;color:#555}
.symbols{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.unicode-symbol{font-size:30px;line-height:1.2;min-width:28px;text-align:center}
.unicode-symbol.large{font-size:36px}
.example-list{margin-top:20px;border-top:1px solid #444;padding-top:10px}
.unicode-example{font-size:26px;line-height:1.45;border-bottom:1px solid #d0d0d0;padding:7px 0}
.font-default{font-family:Arial,Helvetica,sans-serif}
.font-stack{font-family:var(--music-font)}
.font-serif{font-family:serif}


.measure-test{margin:0 60px 18px;border-top:1px solid #444;padding-top:12px}
.measure-test-title{font-size:14px;font-weight:700;margin-bottom:5px}
.measure-test-description{font-size:10.5px;color:#555;margin-bottom:14px}
.measure-test-row{display:flex;align-items:flex-start;gap:0;margin-left:20px}
.measure-box{width:168px;height:58px;min-height:58px;display:flex;align-items:center;justify-content:center;position:relative;font-size:20px;font-weight:700;background:#fff;padding:5px 18px}
.measure-box.last{}
.measure-box.start-repeat{}
.measure-box.end-repeat{}
.measure-chords{display:grid;width:100%;height:100%;align-items:center;justify-items:center}
.measure-chords.one{grid-template-columns:1fr}
.measure-chords.two{grid-template-columns:1fr 1fr}
.measure-chords.four{grid-template-columns:repeat(4,1fr)}
.measure-chords.many{grid-template-columns:repeat(auto-fit,minmax(32px,1fr))}
.measure-chords span{display:flex;align-items:center;justify-content:center;width:100%;text-align:center}
.measure-end-symbol,.measure-start-symbol{font-family:var(--music-font);font-size:36px;font-weight:400;line-height:1}
.measure-start-symbol{position:absolute;left:-11px}
.measure-end-symbol{position:absolute;right:-11px}
.measure-below{position:absolute;right:-10px;bottom:-18px;font-size:12px;font-weight:700;color:#444}
.measure-token{font-family:var(--music-font);font-weight:400;font-size:26px;line-height:1}
.song-measure-row{height:62px;display:flex;align-items:flex-start;gap:0;margin-left:0;margin-bottom:2px}


/* Responsive A4 viewer scaling. The .page stays fixed A4; only the wrapper scales on screen. */
#pageMount{display:flex;justify-content:center;align-items:flex-start;width:100%;gap:24px;}
#pageMount.single{flex-direction:row;}
#pageMount.spread{flex-direction:row;}
@media(max-width:560px){
  .topbar{height:60px;gap:8px;padding:0 8px;}
  .back{padding:7px 9px;font-size:13px;line-height:1.05;min-width:64px;}
  .navbtn{width:42px;height:42px;padding:0;font-size:13px;}
  .count{font-size:13px;line-height:1;white-space:nowrap;min-width:34px;text-align:center;}
  #viewerTitle{font-size:clamp(14px,4.6vw,17px);line-height:1.1;max-width:calc(100vw - 245px);white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
}
@media(max-width:420px){
  .topbar{gap:6px;padding:0 6px;}
  .back{min-width:58px;font-size:12px;padding:6px 8px;}
  .navbtn{width:38px;height:38px;}
  .count{font-size:12px;min-width:28px;}
  #viewerTitle{font-size:clamp(13px,4.2vw,15px);max-width:calc(100vw - 212px);}
}

.page-shell{width:794px;height:1123px;margin:0 0 32px;position:relative;overflow:visible;}
.page-shell .page{margin:0;transform-origin:top left;}
@media print{
  .home,.topbar{display:none!important;}
  .viewer{display:block!important;background:#fff;}
  .frame-wrap{padding:0;overflow:visible;}
  #pageMount{display:block;}
  .page-shell{width:auto!important;height:auto!important;min-height:0!important;margin:0!important;transform:none!important;}
  .page{box-shadow:none;margin:0!important;break-after:page;page-break-after:always;}
}


/* Viewer toolbar final overrides */
#viewerTitle{
  font-size:clamp(13px,3.4vw,18px);
  line-height:1.12;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
}
.back,.navbtn{
  height:38px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
@media(max-width:560px){
  .topbar{gap:6px;padding:0 8px}
  #viewerTitle{font-size:clamp(12px,3.5vw,16px)}
  .back,.navbtn{height:34px}
}
@media(max-width:420px){
  #viewerTitle{font-size:clamp(11px,3.4vw,14px)}
  .back,.navbtn{height:32px}
}



/* TabMeasure pilot */
.tabsection{height:170px;margin:0 60px;position:relative;overflow:visible}
.tabsection-title{font-size:14px;font-weight:700;margin:0 0 4px;color:#1f2933}
.tabsection-note{font-size:10.5px;color:#555;margin:0 0 10px;line-height:1.35}
.tab-measure-row{height:94px;display:flex;align-items:flex-start;gap:0;margin-left:0;margin-bottom:4px}
.tab-measure{width:168px;height:86px;position:relative;background:#fff;flex:0 0 auto}
.tab-string{position:absolute;left:0;right:0;height:1px;background:#333}
.tab-note{position:absolute;transform:translate(-50%,-50%);background:#fff;padding:0 2px;font-size:13px;font-weight:700;line-height:1;color:#111;z-index:4}
.tab-note.ghost{font-weight:700}
.tab-repeat-dot{position:absolute;right:5px;width:4px;height:4px;border-radius:50%;background:#111;z-index:5}
.tab-grid-mark{position:absolute;top:16px;height:55px;width:1px;background:#00000012;z-index:1}
.tab-grid-mark.beat{background:#00000024}


/* Optional strumming pattern above a chord measure. Eight fixed slots = D/U pair per beat. */
.measure-box.has-strum .measure-chords{padding-top:15px}
.measure-strum{position:absolute;left:18px;right:18px;top:2px;height:18px;display:grid;grid-template-columns:repeat(8,1fr);align-items:center;justify-items:center;font-size:15px;font-weight:700;line-height:1;z-index:3}
.measure-strum span{display:flex;align-items:center;justify-content:center;width:100%;height:18px}

/* Simplified full-line riff renderer for rough handwritten tabs. */
.riffsection{height:170px;margin:0 60px;position:relative;overflow:visible}
.riffsection-title{font-size:14px;font-weight:700;margin:0 0 4px;color:#1f2933}
.riffsection-note{font-size:10.5px;color:#555;margin:0 0 10px;line-height:1.35}
.riff-label{position:absolute;top:-16px;transform:translateX(-50%);font-size:12px;font-weight:700;color:#222;white-space:nowrap}
.riff-line.with-labels{margin-top:18px}
.riff-line{width:610px;height:86px;position:relative;background:#fff}
.riff-line::before,.riff-line::after{content:"";position:absolute;top:14px;width:4px;height:55px;background:#111;z-index:1}
.riff-line::before{left:0}.riff-line::after{right:0}
.riff-string{position:absolute;left:0;right:0;height:1px;background:#333}
.riff-note{position:absolute;transform:translate(-50%,-50%);background:#fff;padding:0 2px;font-size:13px;font-weight:700;line-height:1;color:#111;z-index:2}
.riff-note.ghost{font-weight:700}
.riff-measure-bar{position:absolute;top:14px;height:55px;width:2px;background:#111;z-index:1}
.riff-repeat{position:absolute;right:-15px;top:12px;height:58px;width:15px;border-right:4px solid #111;border-left:1px solid #111}
.riff-repeat:before,.riff-repeat:after{content:"";position:absolute;left:-6px;width:4px;height:4px;border-radius:50%;background:#111}
.riff-repeat:before{top:22px}.riff-repeat:after{top:34px}
.tab-bar{position:absolute;top:16px;height:55px;width:1.8px;background:#111;z-index:3}
.tab-bar.left{left:0}
.tab-bar.right{right:0}
.tab-bar.repeat-left{left:0;width:5px;background:linear-gradient(to right,#111 0 1.6px,transparent 1.6px 3px,#111 3px 5px)}
.tab-bar.repeat-right{right:0;width:5px;background:linear-gradient(to right,#111 0 1.6px,transparent 1.6px 3px,#111 3px 5px)}


/* PDF.js source pilot: remote PDF pages are rendered onto the existing A4 page. */
.page.pdf-page{padding:0;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center;}
.pdf-page-canvas{display:block;background:#fff;}
.pdf-footer-overlay{z-index:2;pointer-events:none;}
.pdf-status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:60px;text-align:center;font-size:16px;line-height:1.5;background:#fff;color:#444;z-index:2;}
.pdf-status.error{color:#8b1e1e;}
/* V6: component headings inherit the A4 page background. */
.component-title{background:transparent!important}


/* V7 landscape viewer: maximise usable screen area and float the controls above the score. */
.viewer.viewer-landscape .topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:30;
  background:#20170fe8;
  transition:transform .22s ease,opacity .22s ease;
}
.viewer.viewer-landscape .topbar.toolbar-hidden{
  transform:translateY(-110%);
  opacity:0;
  pointer-events:none;
}
.viewer.viewer-landscape .frame-wrap{padding-top:0!important;padding-bottom:0!important;}
.fullscreen-btn{min-width:40px;font-size:18px;line-height:1;}
@media(orientation:landscape){
  .viewer{min-height:100dvh;}
  .viewer .frame-wrap{min-height:100dvh;}
}


/* V8: toolbar occupies layout space while visible and releases it when hidden. */
.viewer.viewer-landscape{display:flex!important;flex-direction:column;min-height:100dvh;height:100dvh;overflow:hidden}
.viewer.viewer-landscape .topbar{position:relative;flex:0 0 auto;max-height:58px;top:auto;left:auto;right:auto;overflow:hidden;transform:none;transition:max-height .22s ease,opacity .22s ease,padding .22s ease}

FretFlow.normalizeChordLibrary = function(libraryData = {}) {
  const library = libraryData || {};

    if (typeof category === "string") return {id:FretFlow.slug(category) || `category-${index+1}`, name:category};
    const name = String(category && (category.name || category.title || category.id) || `Categorie ${index+1}`).trim();

  const categoryByName = new Map(categories.map(category => [category.name.toLowerCase(), category]));
  const ensureCategory = value => {
    const raw = String(value || "").trim();
    if (categoryById.has(raw)) return raw;
    const named = categoryByName.get(raw.toLowerCase());
    if (named) return named.id;
    if (raw) {
      let id = FretFlow.slug(raw) || "custom";
      let unique = id, suffix = 2;
      while (categoryById.has(unique)) unique = `${id}-${suffix++}`;
      const category = {id:unique, name:raw};

    ? ensureCategory("power-chords")

  const result = [];
  const used = new Set();
  source.forEach((raw,index) => {
    const title = String(raw?.title || raw?.name || raw?.id || `Groep ${index+1}`).trim() || `Groep ${index+1}`;
    let base = FretFlow.slug(raw?.id || title) || `groep-${index+1}`;

FretFlow.initApp = function(){
/* =============================================================================
   VIEW: ViewerView
   ============================================================================= */
class Viewer {
  constructor(app) {
    this.app = app;
    this.activeTab = null;
    this.pages = [];
    this.pageIndex = 0;
    this.mode = "single";
    this.viewPreference = "spread";
    this.touchStart = null;
    this.isAnimating = false;
    this.toolbarTimer = null;
    this.bindEvents();
  }

  bindEvents() {
    document.getElementById("back").onclick = () => this.close();
    document.getElementById("prev").onclick = () => this.move(-1);
    document.getElementById("next").onclick = () => this.move(1);
    const fullscreenButton = document.getElementById("fullscreen");

    const viewModeButton = document.getElementById("viewMode");

      const touch = e.changedTouches[0];
      const dx = touch.clientX - this.touchStart.x;
      const dy = touch.clientY - this.touchStart.y;
      const duration = performance.now() - this.touchStart.time;
      const distance = Math.hypot(dx, dy);

        this.move(dx < 0 ? 1 : -1);

    window.addEventListener("orientationchange", () => setTimeout(() => this.handleViewportChange(), 150));

    const viewer = document.getElementById("viewer");

    this.updateViewerChrome();
    if (this.mode !== previousMode) this.render();
    else this.scalePages();

  open(tab) {
    this.activeTab = tab;
    this.pages = this.app.paginate(tab);
    this.pageIndex = 0;

    document.getElementById("home").style.display = "none";
    document.getElementById("viewer").style.display = "block";
    this.updateViewerChrome();
    this.showToolbar();
    document.getElementById("viewerTitle").textContent = `${tab.nr} · ${tab.title}`;
    location.hash = tab.id;

    scrollTo(0, 0);
  }

  refresh() {
    if (!this.activeTab) return;
    this.pages = this.app.paginate(this.activeTab);
    this.pageIndex = 0;
    this.render();
    this.showToolbar();
  }

  close() {
    document.getElementById("viewer").style.display = "none";
    document.getElementById("home").style.display = "block";
    document.getElementById("pageMount").innerHTML = "";
    this.activeTab = null;
    this.pages = [];
    this.pageIndex = 0;
    this.isAnimating = false;

    this.goToPage(next, delta);

  async goToPage(nextIndex, direction) {
    const mount = document.getElementById("pageMount");
    this.isAnimating = true;

          { opacity: 0, transform: `translateX(${-distance}px)` }

      : [
          { opacity: 0, transform: `translateX(${distance}px)` },
          { opacity: 1, transform: "translateX(0)" }

      duration: 190,

  }

    const topbarVisible = topbar && !topbar.classList.contains("toolbar-hidden");
    const availableHeight = window.innerHeight - (topbarVisible ? topbar.offsetHeight : 0) - (margins.vertical * 2);
    const spreadScale = Math.min(1, availableWidth / ((pageWidth * 2) + margins.gap), availableHeight / pageHeight);
    const MIN_SPREAD_SCALE = 0.42;

    const spreadAllowed = this.viewPreference === "spread" && landscape && this.pages.length > 1 && spreadScale >= MIN_SPREAD_SCALE;
    this.mode = spreadAllowed ? "spread" : "single";
    if (this.mode === "spread" && this.pageIndex % 2 === 1) {
      this.pageIndex -= 1;
    }
  }

  visiblePageIndexes() {
    if (this.mode !== "spread") return [this.pageIndex];
    return [this.pageIndex, this.pageIndex + 1].filter(i => i < this.pages.length);
  }

  render() {
    this.updateMode();
    const mount = document.getElementById("pageMount");
    mount.innerHTML = "";
    mount.className = this.mode;

    this.visiblePageIndexes().forEach(i => {
      const page = this.app.renderPage(this.activeTab, this.pages[i], i, this.pages.length);
      mount.appendChild(this.pageShell(page));
    });

    this.updateControls();
    this.scalePages();
  }

  pageShell(page) {
    const shell = document.createElement("div");
    shell.className = "page-shell";
    shell.appendChild(page);
    return shell;
  }

  updateControls() {
    const visible = this.visiblePageIndexes();
    const label = visible.length === 2
      ? `${visible[0] + 1}-${visible[1] + 1} / ${this.pages.length}`
      : `${visible[0] + 1} / ${this.pages.length}`;
    document.getElementById("count").textContent = label;
    document.getElementById("prev").disabled = this.pageIndex === 0;
    document.getElementById("next").disabled = this.mode === "spread"
      ? this.pageIndex + 2 >= this.pages.length
      : this.pageIndex === this.pages.length - 1;
    this.updateViewModeButton();
  }

  singlePageSideMargin() {
    const w = window.innerWidth;
    if (w < 520) return -18;   // small phones: subtle crop/zoom into the page
    if (w < 900) return 0;     // tablets/large phones: white page fills the viewport width
    return 32;                 // desktop: keep a canvas margin around the A4 sheet
  }

  scalePages() {
    this.updateMode();
    const wrap = document.querySelector(".frame-wrap");
    const mount = document.getElementById("pageMount");
    const shells = document.querySelectorAll(".page-shell");
    if (!wrap || !mount || !shells.length) return;

    mount.className = this.mode;

    const pageWidth = 794;
    const pageHeight = 1123;
    const spreadMargins = this.spreadMargins();
    const gap = this.mode === "spread" && shells.length > 1 ? spreadMargins.gap : 0;
    const topbar = document.querySelector(".topbar");
    const topbarVisible = topbar && !topbar.classList.contains("toolbar-hidden");
    const topbarHeight = topbarVisible ? topbar.offsetHeight : 0;

    let scale;
    if (this.mode === "spread") {
      // Spread mode must always keep both pages fully visible.
      // Margins are compact on tablet-sized viewports and roomier on desktop.
      const availableWidth = wrap.clientWidth - (spreadMargins.side * 2);
      const availableHeight = window.innerHeight - topbarHeight - (spreadMargins.vertical * 2);
      const totalWidth = (pageWidth * shells.length) + gap;
      scale = Math.min(1, availableWidth / totalWidth, availableHeight / pageHeight);
      wrap.style.padding = `${spreadMargins.vertical}px ${spreadMargins.side}px`;
      wrap.style.overflowX = "hidden";
      mount.style.gap = `${gap}px`;
    } else {
      // Single mode adapts the side margin to the device.
      // On small phones this intentionally allows a tiny horizontal crop/zoom.
      const sideMargin = this.singlePageSideMargin();
      const landscape = window.innerWidth > window.innerHeight;
      // Portrait keeps the calmer canvas margins; landscape uses every pixel.
      const verticalPadding = landscape ? 0 : (window.innerWidth < 900 ? 26 : 52);
      const availableWidth = wrap.clientWidth - (sideMargin * 2);
      scale = Math.min(1, availableWidth / pageWidth);
      wrap.style.padding = `${verticalPadding}px ${Math.max(0, sideMargin)}px`;
      wrap.style.overflowX = sideMargin < 0 ? "hidden" : "auto";
      mount.style.gap = "0px";
    }

    shells.forEach(shell => {
      const page = shell.querySelector(".page");
      shell.style.transform = "none";
      shell.style.width = `${pageWidth * scale}px`;
      shell.style.height = `${pageHeight * scale}px`;
      shell.style.minHeight = `${pageHeight * scale}px`;
      if (page) page.style.transform = `scale(${scale})`;
    });
  }
}

/* =============================================================================
   RENDERER: ChordLibraryRenderer
   ============================================================================= */
class ChordLibraryRenderer {
  static PAGE_SIZE = 25;
  constructor(app) { this.app = app; }
  categories() { return this.app.data.library.chordCategories || []; }
  chords() {
    const category = this.app.chordLibraryCategory || "";
    return (this.app.data.library.chords || []).filter(chord => !category || chord.category === category);
  }
  pages() {
    const chords = this.chords();
    if (!chords.length) return [{type:"chord-library", chords:[], total:0}];
    const pages = [];
    for (let i=0;i<chords.length;i+=ChordLibraryRenderer.PAGE_SIZE) {
      pages.push({type:"chord-library", chords:chords.slice(i,i+ChordLibraryRenderer.PAGE_SIZE), total:chords.length});
    }
    return pages;
  }
  renderPage(pageData, pageIndex, pageCount) {
    const page = document.createElement("section");
    page.className = "page chord-library-page";
    page.dataset.renderer = "ChordLibraryRenderer";
    const header = document.createElement("div");
    header.className = "page-header chord-library-header";
    header.innerHTML = `
      <h1 class="ptitle">Alle akkoordschema's</h1>
      <div class="page-meta-line"><span class="chord-library-count">${pageData.total} ${pageData.total === 1 ? "akkoord" : "akkoorden"}</span><span class="page-meta-sep"> · </span><span class="page-subtitle">Blad ${pageIndex + 1} van ${pageCount}</span></div>
      <label class="chord-library-filter"><span>Categorie</span><select aria-label="Filter akkoorden op categorie"><option value="">Alle categorieën</option></select></label>`;
    const select = header.querySelector("select");
    this.categories().forEach(category => {
      const option = document.createElement("option");
      option.value = category.id;
      option.textContent = category.name;
      option.selected = category.id === (this.app.chordLibraryCategory || "");
      select.appendChild(option);
    });
    select.onchange = () => {
      this.app.chordLibraryCategory = select.value;
      this.app.viewer?.refresh();
    };
    page.appendChild(header);
    const grid = document.createElement("div");
    grid.className = "chord-library-grid";
    if (!pageData.chords.length) {
      grid.innerHTML = '<div class="chord-library-empty">Geen akkoorden in deze categorie.</div>';
    } else {
      pageData.chords.forEach(entry => grid.appendChild(ChordDiagramRenderer.render({name:entry.code, ...entry.diagram})));
    }
    page.appendChild(grid);
    return page;
  }
}

/* =============================================================================
   APPLICATION: FretFlowApp, HomeView and record routing
   ============================================================================= */
class FretFlowApp {
  constructor(data, pdfData = {records:[]}, options = {}) {
    this.root = options.root || document;
    this.homeOnly = Boolean(options.homeOnly);
    this.data = FretFlow.normalizeNativeData(data);
    this.data.project = this.data.project || {};
    this.data.project.groups = FretFlow.normalizeGroups(this.data.project.groups || []);
    this.data.project.homepage = this.data.project.homepage || {};
    this.data.tabs = (this.data.tabs || []).map((tab,index) => {
      const normalized = {artist:"",tags:[],description:"",footer:"",groups:[],sections:[],...tab,
        nr:tab.nr || String(index + 1).padStart(2,"0")};
      FretFlow.normalizeRecordGroups(normalized,this.data.project.groups);
      return normalized;
    });
    this.activeTag = "";
    this.chordLibraryCategory = "";
    this.chordLibraryRenderer = new ChordLibraryRenderer(this);
    this.frets = this.data.library.frets;
    this.strings = this.data.library.strings;
    this.rootsA = new Set(this.data.library.rootsA);
    this.rootsC = new Set(this.data.library.rootsC);
    this.viewer = this.homeOnly ? null : new Viewer(this);
    this.pdfDocuments = new Map();
    this.pdfRecords = new Map((pdfData.records || []).map(record => [record.embeddedId || record.id, record]));
    const projectMeta = this.data.project || {};
    const homepage = projectMeta.homepage || {};
    const hero = this.root.querySelector(".hero");
    if (hero) {
      const badge = hero.querySelector(".badge");
      const title = hero.querySelector("h1");
      const intro = hero.querySelector("p");
      if (badge) badge.textContent = homepage.badge || "Digitale gitaarmap";
      if (title) title.textContent = homepage.title || projectMeta.title || "FretFlow";
      if (intro) intro.textContent = homepage.intro || projectMeta.description || "Kies een oefenblad.";
    }
    const homeFooter = this.$id("homeFooter");
    if (homeFooter) {
      homeFooter.textContent = FretFlow.APP_CREDIT;
      homeFooter.hidden = false;
    }
    if (!this.homeOnly && this.root === document && projectMeta.title) document.title = projectMeta.title;
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    }
    this.pent = {
      0:[5,8,10,12,15,17], 1:[5,8,10,13,15,17], 2:[5,7,9,12,14,17],
      3:[5,7,10,12,14,17], 4:[5,7,10,12,15,17], 5:[5,8,10,12,15,17]
    };
    this.bindEvents();
    this.renderCards();
    if (!this.homeOnly && location.hash) this.openTab(location.hash.slice(1));
  }

  $id(id) { return this.root.querySelector(`#${id}`); }

  createElement(tag) { return (this.root.ownerDocument || document).createElement(tag); }

  bindEvents() {
    const search = this.$id("search");
    if (search) search.oninput = e => this.renderCards(e.target.value);
    const tagFilter = this.$id("tagFilter");
    if (tagFilter) {
      const tagMap = new Map();
      this.records().flatMap(t => t.tags || []).filter(Boolean).forEach(tag => {
        const key = FretFlow.tagKey(tag);
        if (key && !tagMap.has(key)) tagMap.set(key, tag);
      });
      const tags = [...tagMap.values()].sort((a,b)=>a.localeCompare(b,"nl",{sensitivity:"base"}));
      tagFilter.innerHTML = '<option value="">Alle tags</option>' + tags.map(tag => `<option value="${FretFlow.escape(tag)}">${FretFlow.escape(tag)}</option>`).join("");
      tagFilter.onchange = e => { this.activeTag = e.target.value; this.renderCards(this.$id("search")?.value || ""); };
    }
  }

  systemPages() {
    const config = this.data.project?.systemPages?.chordLibrary || FretFlow.defaultSystemPages().chordLibrary;
    return [{
      id:"chord-library", nr:"LIB", title:"Alle akkoordschema's",
      homeTitle:config.title || "Akkoordenbibliotheek",
      description:config.description || "Bekijk alle akkoorddiagrammen per categorie.",
      groups:[], tags:["akkoorden"], systemType:"chord-library"
    }];
  }

  records() { return [...this.data.tabs, ...this.systemPages()]; }

  visibleTabs() {
    const records = this.records();
    return this.activeTag ? records.filter(t => (t.tags || []).some(tag => FretFlow.tagKey(tag) === FretFlow.tagKey(this.activeTag))) : records;
  }

  renderCards(query="") {
    const q = query.trim().toLowerCase();
    const cards = this.$id("cards");

    if (q || this.activeTag) {
      this.renderSearchResults(q);
      return;
    }

    this.renderCategories();
  }

  groupConfigs() {
    return FretFlow.normalizeGroups(this.data.project?.groups || []);
  }

  groupById(id) {
    return this.groupConfigs().find(group => group.id === id) || null;
  }

  groups() {
    const tabs = this.visibleTabs().filter(t => !t.systemType);
    return this.groupConfigs().map(config => ({
      ...config,
      count:tabs.filter(tab => (tab.groups || []).includes(config.id)).length
    }));
  }

  renderCategories() {
    const cards = this.$id("cards");
    if (!cards) return;
    cards.innerHTML = "";
    cards.className = "category-grid";
    this.setBreadcrumb(null);

    const page = this.systemPages()[0];
    if (page) {
      const b = this.createElement("button");
      b.className = "category-card system-card";
      b.dataset.component = "HomeSystemTile";
      b.innerHTML = `<h2>${FretFlow.escape(page.homeTitle || page.title)}</h2><p>${FretFlow.escape(page.description || "")}</p><span class="count-badge">${(this.data.library.chords || []).length} akkoorden</span>`;
      b.onclick = () => this.openTab(page.id);
      cards.appendChild(b);
    }

    this.groups().forEach(group => {
      const b = this.createElement("button");
      b.className = "category-card";
      b.dataset.component = "HomeGroupTile";
      b.innerHTML = `<h2>${FretFlow.escape(group.title)}</h2><p>${FretFlow.escape(group.description || "")}</p><span class="count-badge">${group.count} bladen</span>`;
      b.onclick = () => this.renderGroup(group.id);
      cards.appendChild(b);
    });
  }

  renderGroup(groupId) {
    const group = this.groups().find(g => g.id === groupId);
    if (!group) return;
    const cards = this.$id("cards");
    cards.innerHTML = "";
    cards.className = "grid";
    this.setBreadcrumb(group);

    this.visibleTabs()
      .filter(t => (t.groups || []).includes(groupId) && !t.systemType)
      .forEach(t => cards.appendChild(this.cardForTab(t)));
  }

  renderSearchResults(q) {
    const cards = this.$id("cards");
    cards.innerHTML = "";
    cards.className = "grid";
    const title = q && this.activeTag
      ? `Resultaten voor “${q}” of tag “${this.activeTag}”`
      : q
        ? `Zoekresultaten voor “${q}”`
        : `Tabs met tag “${this.activeTag}”`;
    this.setBreadcrumb({ title, search: true });

    const matches = this.records().filter(t => {
      const groupText = (t.groups || []).map(id => this.groupById(id)?.title || id);
      const textMatch = q && [t.title,t.artist,t.description,...groupText,...(t.tags||[])].filter(Boolean).join(" ").toLowerCase().includes(q);
      const tagMatch = this.activeTag && (t.tags || []).some(tag => FretFlow.tagKey(tag) === FretFlow.tagKey(this.activeTag));
      if (q && this.activeTag) return textMatch || tagMatch;
      if (q) return textMatch;
      if (this.activeTag) return tagMatch;
      return true;
    });

    if (!matches.length) {
      cards.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:#6f6256;padding:20px;">Geen resultaten.</div>`;
      return;
    }

    matches.forEach(t => cards.appendChild(this.cardForTab(t)));
  }

  cardForTab(t) {
    const b = this.createElement("button");
    b.className = "card";
    b.dataset.component = "HomeRecordTile";
    b.innerHTML = `${t.nr ? `<div class="nr">${FretFlow.escape(t.nr)}</div>` : ""}<h2>${FretFlow.escape(t.title)}</h2><p>${FretFlow.escape(t.description || "")}</p>`;
    b.onclick = () => this.openTab(t.id);
    return b;
  }

  setBreadcrumb(state) {
    let bc = this.$id("breadcrumb");
    if (!bc) {
      bc = this.createElement("div");
      bc.id = "breadcrumb";
      bc.className = "breadcrumb";
      this.root.querySelector(".shell").insertBefore(bc, this.$id("cards"));
    }

    if (!state) {
      bc.style.display = "none";
      bc.innerHTML = "";
      return;
    }

    bc.style.display = "flex";
    bc.innerHTML = `<button class="home-back" id="homeCrumb">← Terug</button><strong>${state.title}</strong>`;
    this.$id("homeCrumb").onclick = () => {
      this.$id("search").value = "";
      const tagFilter = this.$id("tagFilter");
      if (tagFilter) tagFilter.value = "";
      this.activeTag = "";
      this.renderCategories();
    };
  }

  openTab(id) {
    const tab = this.records().find(t => t.id === id);
    if (!tab) return;
    if (this.viewer) this.viewer.open(tab);
  }

  makeComponent(section) {
    const map = {
      fretboard: FretboardComponent,
      transition: FretboardComponent,
      rootmap: RootMapComponent,
      text: TextComponent,
      textgrid: TextGridComponent,
      chordgrid: ChordGridComponent,
      chordsection: ChordSectionComponent,
      songsection: ChordSectionComponent,
      tabsection: TabSectionComponent,
      simpleriff: SimpleRiffComponent,
      riffsection: RiffSectionComponent,
      separator: SeparatorComponent,
      unicodeplayground: UnicodePlaygroundComponent,
      measuretest: MeasureTestComponent
    };
    const Klass = map[section.type] || TextGridComponent;
    return new Klass(section, this);
  }

  paginate(tab) {
    if (tab.systemType === "chord-library") return this.chordLibraryRenderer.pages();
    if (tab.source && tab.source.type === "pdf") {
      const count = Math.max(1, Number(tab.source.pageCount) || 1);
      return Array.from({ length: count }, (_, index) => ({ pdfPage: index + 1 }));
    }

    const PAGE_BUDGET = Layout.BODY_BUDGET;
    const pages = [];
    let current = [];
    let used = 0;

    const sections = this.renderableSections(tab);

    for (const section of sections) {
      const component = this.makeComponent(section);
      const h = component.height;
      if (current.length && used + h > PAGE_BUDGET) {
        pages.push(current);
        current = [];
        used = 0;
      }
      current.push(component);
      used += h;
    }
    if (current.length) pages.push(current);
    if (!pages.length) pages.push([]);
    return pages;
  }

  renderableSections(tab) {
    // Keep Text blocks as independent components. Their title, measured body
    // height and page-break behaviour belong to the individual block.
    return tab.sections || [];
  }

  mergeAdjacentTextSections(sections) {
    const merged = [];
    sections.forEach(section => {
      if (section.type !== "text") {
        merged.push(section);
        return;
      }
      const current = this.textLines(section);
      const previous = merged[merged.length - 1];
      if (previous && previous.type === "text") {
        previous.lines = [...this.textLines(previous), ...current];
        delete previous.title;
        delete previous.text;
        delete previous.body;
      } else {
        merged.push({ type: "text", lines: current });
      }
    });
    return merged;
  }

  textLines(section) {
    if (section.lines) return section.lines;
    const lines = [];
    if (section.title) lines.push({ title: section.title });
    const text = section.text || section.body || "";
    if (text) lines.push({ text });
    return lines;
  }

  renderPage(tab, components, pageIndex = 0, pageCount = 1) {
    if (tab.systemType === "chord-library") return this.chordLibraryRenderer.renderPage(components, pageIndex, pageCount);
    const page = document.createElement("section");

    if (tab.source && tab.source.type === "pdf") {
      page.className = "page pdf-page";
      page.dataset.renderer = "FretFlowApp";
      page.dataset.view = "PdfPage";
      const pdfPage = (components && components.pdfPage) || pageIndex + 1;
      const canvas = document.createElement("canvas");
      canvas.className = "pdf-page-canvas";
      canvas.setAttribute("aria-label", `${tab.title} — pagina ${pdfPage}`);
      const status = document.createElement("div");
      status.className = "pdf-status";
      status.textContent = `PDF-pagina ${pdfPage} laden…`;
      page.append(canvas, status);
      if (tab.footer) {
        const footer = document.createElement("div");
        footer.className = "footer pdf-footer-overlay";
        footer.dataset.component = "PdfFooterOverlay";
        footer.textContent = tab.footer;
        page.appendChild(footer);
      }
      this.renderPdfPage(tab, pdfPage, canvas, status);
      return page;
    }

    page.className = "page";
    page.dataset.renderer = "FretFlowApp";
    page.dataset.view = "RecordPage";
    page.style.setProperty("--layout-unit", `${Layout.UNIT}px`);
    const displayTitle = (tab.artist ? `${tab.title} - ${tab.artist}` : tab.title) || "Nieuwe tab";
    const tagText = (tab.tags || []).join(" · ");
    page.innerHTML = `
      <div class="page-header">
        <h1 class="ptitle">${FretFlow.escape(displayTitle)}</h1>
        <div class="page-meta-line">
          ${tagText ? `<span class="page-tags">${FretFlow.escape(tagText)}</span><span class="page-meta-sep"> · </span>` : ""}
          <span class="page-subtitle">Blad ${pageIndex + 1} van ${pageCount}</span>
        </div>
        ${pageIndex === 0 && tab.description ? `<div class="page-intro">${FretFlow.escape(tab.description)}</div>` : ""}
      </div>
    `;
    components.forEach(component => page.appendChild(component.render()));
    if ((tab.footer || "") || (tab.legend || []).length) {
      const footer = document.createElement("div");
      footer.className = "footer";
      footer.innerHTML = FretFlow.escape(tab.footer || "") + this.renderLegend(tab.legend || []);
      page.appendChild(footer);
    }
    return page;
  }

  async getPdfDocument(tab) {
    if (!window.pdfjsLib) throw new Error("PDF.js kon niet worden geladen. Controleer de internetverbinding.");
    const embeddedId = tab.source && tab.source.embeddedId;
    if (!embeddedId) throw new Error("Geen ingebedde PDF ingesteld in de JSON-entry.");
    if (!this.pdfDocuments.has(embeddedId)) {
      const record = this.pdfRecords && this.pdfRecords.get(embeddedId);
      const legacyNode = document.getElementById(embeddedId);
      const base64 = String((record && record.data) || (legacyNode && legacyNode.textContent) || "").replace(/\s+/g, "");
      if (!base64) throw new Error(`Ingebedde PDF-data niet gevonden: ${embeddedId}`);
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      const task = window.pdfjsLib.getDocument({ data: bytes });
      this.pdfDocuments.set(embeddedId, task.promise.catch(error => {
        this.pdfDocuments.delete(embeddedId);
        throw error;
      }));
    }
    return this.pdfDocuments.get(embeddedId);
  }

  async renderPdfPage(tab, pageNumber, canvas, status) {
    try {
      const pdf = await this.getPdfDocument(tab);
      if (!canvas.isConnected && !this.allowDetachedPdfRender) return;
      const pdfPage = await pdf.getPage(pageNumber);
      if (!canvas.isConnected && !this.allowDetachedPdfRender) return;
      const base = pdfPage.getViewport({ scale: 1 });
      const fitScale = Math.min(794 / base.width, 1123 / base.height);
      const outputScale = Math.min(window.devicePixelRatio || 1, 2);
      const viewport = pdfPage.getViewport({ scale: fitScale * outputScale });
      canvas.width = Math.floor(viewport.width);
      canvas.height = Math.floor(viewport.height);
      canvas.style.width = `${viewport.width / outputScale}px`;
      canvas.style.height = `${viewport.height / outputScale}px`;
      const context = canvas.getContext("2d", { alpha: false });
      await pdfPage.render({ canvasContext: context, viewport }).promise;
      if (status.isConnected || this.allowDetachedPdfRender) status.remove();
    } catch (error) {
      console.error("PDF.js render error", error);
      if (!status.isConnected && !this.allowDetachedPdfRender) return;
      status.className = "pdf-status error";
      const message = error && error.message ? error.message : String(error);
      status.textContent = `De PDF kon niet worden geladen: ${message}`;
    }
  }

  renderLegend(items) {
    if (!items.length) return "";
    return `<div class="legend">${items.map(l => `<span class="li"><span class="note ${l.class} ld">${l.label}</span>${l.text}</span>`).join("")}</div>`;
  }

  left(f) { return (this.frets.indexOf(f) + .5) * (520 / this.frets.length); }
  between(f) { return (f - this.frets[0] + .5) * (520 / this.frets.length); }

  rootNotes(mode) {
    const out = {};
    Object.entries(this.pent).forEach(([si, ns]) => {
      out[si] = [];
      ns.forEach(f => {
        const key = `${si}-${f}`;
        if (mode === "A" && this.rootsA.has(key)) out[si].push(f);
        if (mode === "C" && this.rootsC.has(key)) out[si].push(f);
        if (mode === "AC") out[si].push(f);
      });
    });
    return out;
  }

  rootGhost(mode) {
    if (mode !== "AC") return {};
    const out = {};
    Object.entries(this.pent).forEach(([si, ns]) => {
      out[si] = ns.filter(f => !this.rootsA.has(`${si}-${f}`) && !this.rootsC.has(`${si}-${f}`));
    });
    return out;
  }
}

/* =============================================================================
   LAYOUT MODEL
   ============================================================================= */
const Layout = {
  PAGE_HEIGHT: 1123,
  HEADER_RESERVE: 82,
  FOOTER_RESERVE: 60,
  UNIT: 20,
  units(count) { return Math.max(0, Number(count) || 0) * this.UNIT; },
  BODY_UNITS: 49,
  get BODY_BUDGET() { return this.units(this.BODY_UNITS); },
  COMPONENT_HEADER_UNITS: 2,
  COMPONENT_GAP_UNITS: 1,
  TEXT_LINE_UNITS: 1,
  TEXT_MIN_BODY_UNITS: 1,
  TEXT_CONTENT_WIDTH: 674,
  TEXT_FONT: "11px Arial",
  FRETBOARD_UNITS: 8,
  TEXTGRID_UNITS: 8,
  CHORDGRID_UNITS: 9,
  SIMPLE_RIFF_ROW_UNITS: 5,
  CHORD_ROW_UNITS: 4,
  TAB_ROW_UNITS: 5,
  SEPARATOR_UNITS: 1
};

/* =============================================================================
   COMPONENT BASE CLASS
   ============================================================================= */
class Component {
  constructor(data, app) {
    this.data = data;
    this.app = app;
    this.units = this.constructor.UNITS || 0;
    this.height = this.units ? Layout.units(this.units) : (this.constructor.HEIGHT || Layout.units(1));
  }

  applyLayoutUnits(element, units = this.units) {
    if (!element) return element;
    element.dataset.component = this.constructor.name;
    element.dataset.layoutUnits = String(units || 0);
    element.style.setProperty("--component-units", String(units || 0));
    element.style.setProperty("--component-height", `${Layout.units(units || 0)}px`);
    return element;
  }
}

/* COMPONENT: FretboardComponent */
class FretboardComponent extends Component {
  static UNITS = Layout.FRETBOARD_UNITS;

  getNotes() { return this.data.notes || {}; }

  render() {
    const sec = document.createElement("div");
    sec.className = "music-component component-block fretboard-block";
    sec.innerHTML = `<h2 class="component-title">${this.data.title} ${this.data.small ? `<span style="font-weight:400;font-size:10px;">${this.data.small}</span>` : ""}</h2>`;
    sec.appendChild(this.renderBoard(this.getNotes(), this.getGhost()));
    return this.applyLayoutUnits(sec);
  }

  renderBoard(notes, ghost) {
    const b = document.createElement("div");
    b.className = "board" + (this.data.coach ? "" : " nocoach");
    b.innerHTML = '<div class="fl">Fret</div><div class="fr">' + this.app.frets.map(f => `<span>${f}</span>`).join("") + "</div>";

    this.app.strings.forEach((s, si) => {
      const lab = document.createElement("div");
      lab.className = "sl";
      lab.style.gridRow = si + 2;
      lab.textContent = s;
      b.appendChild(lab);

      const row = document.createElement("div");
      row.className = "sg" + (si === 5 ? " last" : "");
      row.style.gridRow = si + 2;
      row.innerHTML = this.app.frets.map(() => "<div></div>").join("");

      (notes[si] || notes[String(si)] || []).forEach(f => {
        const key = `${si}-${f}`;
        const n = document.createElement("span");
        let cl = "note";
        let txt = f;
        if (this.app.rootsA.has(key)) cl += " root";
        if ((ghost[si] || ghost[String(si)] || []).includes(f)) cl += " ghost";
        n.className = cl;
        n.textContent = txt;
        n.style.left = this.app.left(f) + "px";
        row.appendChild(n);
      });

      (this.data.arrows || []).filter(a => a[0] === si).forEach(a => {
        const x = document.createElement("span");
        x.className = "arrow";
        x.textContent = "→";
        x.style.left = this.app.between(a[1]) + "px";
        row.appendChild(x);
      });

      (this.data.slashes || []).filter(a => a[0] === si).forEach(a => {
        const x = document.createElement("span");
        x.className = "slash";
        x.textContent = "/";
        x.style.left = this.app.between(a[1]) + "px";
        row.appendChild(x);
      });

      b.appendChild(row);
    });

    if (this.data.coach) {
      const c = document.createElement("div");
      c.className = "coach";
      c.innerHTML = this.data.coach;
      b.appendChild(c);
    }
    return b;
  }
}

      // Re-label root-map notes by looking at class/text/fret is handled in a small post-process below.
    });

/* COMPONENT: TextComponent */
class TextComponent extends Component {
  constructor(data, app) {
    super(data, app);
    const bodyLines = this.bodyLines(data);
    const visualLines = bodyLines.reduce((sum, line) => sum + this.wrappedLineCount(line), 0);
    const bodyUnits = Math.max(Layout.TEXT_MIN_BODY_UNITS, visualLines * Layout.TEXT_LINE_UNITS);
    // Text has no extra bottom-gap unit: the rounded body units already contain
    // the breathing room needed below the final line.
    this.units = Layout.COMPONENT_HEADER_UNITS + bodyUnits;
    this.height = Layout.units(this.units);
  }

  bodyLines(data) {
    const legacyLines = Array.isArray(data.lines) ? data.lines : [];
    if (legacyLines.length) {
      return legacyLines.flatMap(line => String(line.title || line.text || "").split(/\n/));
    }
    return String(data.text || data.body || "").split(/\n/);
  }

  wrappedLineCount(text) {
    const value = String(text || "");
    if (!value) return 1;
    const fallback = () => Math.max(1, Math.ceil(value.length / 92));
    if (typeof document === "undefined") return fallback();
    const canvas = TextComponent.measureCanvas || (TextComponent.measureCanvas = document.createElement("canvas"));
    const context = canvas.getContext && canvas.getContext("2d");
    if (!context) return fallback();
    context.font = Layout.TEXT_FONT;
    const maxWidth = Layout.TEXT_CONTENT_WIDTH;
    const words = value.trim().split(/\s+/);
    if (!words.length) return 1;
    let lines = 1;
    let current = "";
    for (const word of words) {
      // Long unbroken strings still need to consume multiple visual lines.
      if (context.measureText(word).width > maxWidth) {
        if (current) { lines += 1; current = ""; }
        lines += Math.max(1, Math.ceil(context.measureText(word).width / maxWidth)) - 1;
        continue;
      }
      const candidate = current ? `${current} ${word}` : word;
      if (current && context.measureText(candidate).width > maxWidth) {
        lines += 1;
        current = word;
      } else {
        current = candidate;
      }
    }
    return Math.max(1, lines);
  }

  render() {
    const wrap = document.createElement("div");
    wrap.className = "music-component text-component";
    const title = this.data.title || "";
    const body = this.data.text || this.data.body || "";
    const legacyLines = Array.isArray(this.data.lines) ? this.data.lines : [];
    wrap.innerHTML = `<div class="component-title">${FretFlow.escape(title)}</div><div class="component-content text-component-content"></div>`;
    const content = wrap.querySelector(".text-component-content");
    if (legacyLines.length) {
      content.innerHTML = legacyLines.map(line => line.title
        ? `<div class="text-component-line text-component-line-title">${FretFlow.escape(line.title)}</div>`
        : `<p class="text-component-line text-component-body">${FretFlow.escape(line.text || "")}</p>`).join("");
    } else {
      content.textContent = body;
    }
    return this.applyLayoutUnits(wrap);
  }
}

/* COMPONENT BASE: MusicSectionComponent */
class MusicSectionComponent extends Component {
  static UNITS = Layout.COMPONENT_HEADER_UNITS + Layout.CHORD_ROW_UNITS;

  constructor(data, app) {
    super(data, app);
    this.lines = data.lines || [];
    this.units = Layout.COMPONENT_HEADER_UNITS + Math.max(1, this.lines.length) * Layout.CHORD_ROW_UNITS;
    this.height = Layout.units(this.units);
  }

  render() {
    const g = document.createElement("div");
    g.className = "music-component songsection chordsection";

    const head = document.createElement("div");
    head.className = "songsection-head";
    head.innerHTML = `${this.segno(this.data.segno)}<div class="songsection-title">${this.data.title ?? this.data.name ?? ""}</div>`;
    g.appendChild(head);

    this.lines.forEach(line => g.appendChild(this.renderMeasureRow(line)));
    return this.applyLayoutUnits(g);
  }

  segno(type) {
    if (type === "single") return `<span class="segno">&#x1D10B;</span>`;
    if (type === "double") return `<span class="segno">&#x1D10B; &#x1D10B;</span>`;
    return `<span style="width:20px;display:inline-block"></span>`;
  }

  normalizedMeasures(line) {
    const raw = (line.measures || []).slice(0, 4);

    return raw.map((m, i) => {
      const isLast = i === raw.length - 1;
      const obj = Array.isArray(m)
        ? { chords: m }
        : (typeof m === "object" && m !== null)
          ? { ...m }
          : { chords: String(m).split(/\s*\+\s*/) };

      if (obj.startBar == null || obj.startBar === "") obj.startBar = i === 0 ? "single" : "none";
      if (obj.endBar == null || obj.endBar === "") obj.endBar = "single";
      if (isLast && line.ending && !obj.endBar) obj.endBar = line.ending;
      if (isLast && line.belowRight && !obj.belowRight) obj.belowRight = line.belowRight;
      return obj;
    });
  }
}

class MusicMeasure {
  constructor(data, isLast = false) {
    this.data = data || {};
    this.isLast = isLast;
    this.strum = [];
    if (this.data.strum) this.setStrum(this.data.strum);
  }

  static get symbols() {
    return {
      startRepeat: "𝄆",
      endRepeat: "𝄇",
      singleBar: "𝄀",
      doubleBar: "𝄁",
      finalBar: "𝄂",
      repeatedFigure: "𝄎",
      dalSegno: "𝄉"
    };
  }

  setStrum(pattern) {
    if (Array.isArray(pattern)) {
      this.strum = pattern.slice(0, 8);
    } else {
      const beats = String(pattern).trim().split(/\s+/).slice(0, 4);
      this.strum = beats.flatMap(beat => {
        const token = beat.toUpperCase();
        return [token.includes("D") ? "D" : null, token.includes("U") ? "U" : null];
      });
    }
    while (this.strum.length < 8) this.strum.push(null);
    return this;
  }

  baseClasses() {
    const classes = ["measure-box"];
    if (this.isLast) classes.push("last");
    if (this.data.startBar === "repeat") classes.push("start-repeat");
    if (this.data.endBar === "repeat") classes.push("end-repeat");
    if (this.strum.some(Boolean)) classes.push("has-strum");
    return classes;
  }

  renderStrum(box) {
    if (!this.strum.some(Boolean)) return;
    const symbols = this.strum.map(value => {
      if (value === "D") return "<span aria-label=\"downstroke\">↓</span>";
      if (value === "U") return "<span aria-label=\"upstroke\">↑</span>";
      return "<span></span>";
    });
    while (symbols.length < 8) symbols.push("<span></span>");
    box.insertAdjacentHTML("afterbegin", `<div class="measure-strum">${symbols.join("")}</div>`);
  }

  renderFrame(box) {
    const music = MusicMeasure.symbols;
    const startSymbol = this.data.startBar === "repeat" ? music.startRepeat : music.singleBar;
    box.insertAdjacentHTML("beforeend", `<span class="measure-start-symbol">${startSymbol}</span>`);

    const endSymbol = this.endSymbol(music);
    if (endSymbol) box.insertAdjacentHTML("beforeend", `<span class="measure-end-symbol">${endSymbol}</span>`);

    if (this.data.belowRight) {
      box.insertAdjacentHTML("beforeend", `<div class="measure-below">${this.renderBelow(this.data.belowRight, music)}</div>`);
    }
  }

  endSymbol(music = MusicMeasure.symbols) {
    if (this.data.endBar === "repeat") return music.endRepeat;
    if (this.data.endBar === "double") return music.doubleBar;
    if (this.data.endBar === "final") return music.finalBar;
    return this.isLast ? music.singleBar : "";
  }

  renderBelow(text, music = MusicMeasure.symbols) {
    if (text === "D.S.") return `<span class="measure-token">${music.dalSegno}</span>`;
    return text;
  }
}

class ChordMeasure extends MusicMeasure {
  constructor(data, isLast = false) {
    super(data, isLast);
    this.canvas = new TabCanvas({ width: 168, top: 15, gap: 11, leftPad: 0, rightPad: 0 });
  }

  render() {
    const music = MusicMeasure.symbols;
    const box = document.createElement("div");
    box.className = this.baseClasses().join(" ") + " chord-measure-shared-frame";

    const chordList = this.data.chords || [""];
    const layoutClass = chordList.length === 1 ? "one" : chordList.length === 2 ? "two" : chordList.length === 4 ? "four" : "many";
    const chords = chordList.map(c => `<span>${this.renderChord(c, music)}</span>`).join("");
    box.innerHTML = `<div class="measure-chords ${layoutClass}">${chords}</div>`;

    this.renderStrum(box);
    this.renderSharedFrame(box);
    return box;
  }

  renderSharedFrame(box) {
    const start = this.data.startBar || "none";
    if (start !== "none") box.appendChild(this.canvas.barElement("start", start));
    const end = this.data.endBar || "single";
    if (end !== "none") box.appendChild(this.canvas.barElement("end", end));
    if (this.data.belowRight) {
      const below = document.createElement("span");
      below.className = "tab-below chord-below";
      below.innerHTML = this.renderBelow(this.data.belowRight);
      box.appendChild(below);
    }
  }

  renderChord(chord, music = MusicMeasure.symbols) {
    if (chord === "%") return `<span class="measure-token">${music.repeatedFigure}</span>`;
    return chord;
  }
}
class TabCanvas {
  constructor({ width, top = 18, gap = 11, leftPad = 12, rightPad = 12 }) {
    this.width = width;
    this.top = top;
    this.gap = gap;
    this.leftPad = leftPad;
    this.rightPad = rightPad;
  }

  yFor(stringNumber) {
    const index = Math.max(0, Math.min(5, Number(stringNumber || 1) - 1));
    return this.top + index * this.gap;
  }

  renderStrings(box) {
    for (let stringNumber = 1; stringNumber <= 6; stringNumber++) {
      const line = document.createElement("span");
      line.className = "tab-string";
      line.style.top = `${this.yFor(stringNumber)}px`;
      box.appendChild(line);
    }
  }

  barElement(side, type = "single") {
    const bar = document.createElement("span");
    bar.className = `tab-boundary ${side} ${type}`;
    if (type === "repeat") {
      [3, 4].forEach(stringNumber => {
        const dot = document.createElement("span");
        dot.className = "tab-boundary-dot";
        dot.style.top = `${this.yFor(stringNumber) - this.top - 2}px`;
        bar.appendChild(dot);
      });
    }
    return bar;
  }
}

class SimpleRiffMeasure extends MusicMeasure {
  constructor(data) {
    super(data, true);
    this.canvas = new TabCanvas({ width: 674, top: 18, gap: 11, leftPad: 12, rightPad: 12 });
  }

  render() {
    const box = document.createElement("div");
    box.className = "simple-riff-canvas tab-canvas";
    this.canvas.renderStrings(box);
    (this.data.notes || []).forEach(note => {
      const raw = String(note.position ?? "0").trim();
      let pct = parseFloat(raw);
      if (!Number.isFinite(pct)) pct = 0;
      pct = Math.max(0, Math.min(100, pct));
      const x = this.canvas.leftPad + (pct / 100) * (this.canvas.width - this.canvas.leftPad - this.canvas.rightPad);
      const y = this.canvas.yFor(note.string);
      const n = document.createElement("span");
      n.className = "tab-note simple-riff-note";
      n.textContent = note.fret ?? "";
      n.style.left = `${x}px`;
      n.style.top = `${y}px`;
      box.appendChild(n);
      if (note.type && note.type !== "standard") {
        const mark = document.createElement("span");
        mark.className = `tab-technique simple-riff-technique ${note.type}`;
        mark.style.left = `${x + 8}px`;
        mark.style.top = `${y - 15}px`;
        if (note.type === "slideUp") mark.textContent = "/";
        if (note.type === "slideDown") mark.textContent = "\\";
        box.appendChild(mark);
      }
    });
    const start = this.data.startBar || "single";
    const end = this.data.endBar || "single";
    if (start !== "none") box.appendChild(this.canvas.barElement("start", start));
    if (end !== "none") box.appendChild(this.canvas.barElement("end", end));
    const markerLabels = {segno:"𝄋", doubleSegno:"𝄋 𝄋", coda:"𝄌"};
    if (markerLabels[this.data.marker]) {
      const marker = document.createElement("span");
      marker.className = "tab-marker";
      marker.textContent = markerLabels[this.data.marker];
      box.appendChild(marker);
    }
    if (this.data.belowRight) {
      const below = document.createElement("span");
      below.className = "tab-below simple-riff-below";
      below.textContent = this.data.belowRight;
      box.appendChild(below);
    }
    return box;
  }
}

/* COMPONENT DETAIL: TabMeasure */
class TabMeasure extends MusicMeasure {
  constructor(data, isLast = false) {
    super(data, isLast);
    this.width = 168;
    this.height = 92;
    this.leftPad = 12;
    this.rightPad = 12;
    this.top = 18;
    this.gap = 11;
    this.canvas = new TabCanvas({
      width: this.width,
      top: this.top,
      gap: this.gap,
      leftPad: this.leftPad,
      rightPad: this.rightPad
    });
  }

  render() {
    const box = document.createElement("div");
    box.className = this.baseClasses().map(c => c === "measure-box" ? "tab-measure" : c).join(" ");
    this.canvas.renderStrings(box);
    this.renderBars(box);
    this.renderNotes(box);
    this.renderAboveAnnotation(box);
    this.renderMarker(box);
    this.renderBelowAnnotation(box);
    return box;
  }

  xForPosition(value) {
    const raw = String(value ?? "1").trim();
    const usable = this.width - this.leftPad - this.rightPad;
    if (raw.endsWith("%")) {
      const pct = Math.max(0, Math.min(100, parseFloat(raw) || 0));
      return this.leftPad + (pct / 100) * usable;
    }
    const pos = Math.max(1, Math.min(16, parseFloat(raw) || 1));
    return this.leftPad + ((pos - 1) / 15) * usable;
  }

  renderBars(box) {
    const start = this.data.startBar || "single";
    if (start !== "none") box.appendChild(this.canvas.barElement("start", start));
    const end = this.data.endBar || (this.isLast ? "single" : "none");
    if (end !== "none") box.appendChild(this.canvas.barElement("end", end));
  }

  renderNotes(box) {
    (this.data.notes || []).forEach(note => {
      const x = this.xForPosition(note.position);
      const y = this.canvas.yFor(note.string);
      const n = document.createElement("span");
      n.className = "tab-note" + (note.ghost ? " ghost" : "");
      n.textContent = note.ghost ? `(${note.fret})` : note.fret;
      n.style.left = `${x}px`;
      n.style.top = `${y}px`;
      box.appendChild(n);
      this.renderTechnique(box, note, x, y);
    });
  }

  renderTechnique(box, note, x, y) {
    if (!note.type || note.type === "standard") return;
    const technique = document.createElement("span");
    technique.className = `tab-technique ${note.type}`;
    technique.style.left = `${x + 8}px`;
    technique.style.top = `${y - 15}px`;
    if (note.type === "slideUp") technique.textContent = "/";
    if (note.type === "slideDown") technique.textContent = "\\";
    box.appendChild(technique);
  }

  renderAboveAnnotation(box) {
    const values = String(this.data.above || "")
      .split(",")
      .map(value => value.trim())
      .filter(Boolean);
    if (!values.length) return;

    const above = document.createElement("div");
    above.className = "tab-above";
    above.style.gridTemplateColumns = `repeat(${values.length}, minmax(0, 1fr))`;
    values.forEach(value => {
      const item = document.createElement("span");
      item.textContent = value;
      above.appendChild(item);
    });
    box.appendChild(above);
  }

  renderMarker(box) {
    const labels = {segno:"𝄋", doubleSegno:"𝄋 𝄋", coda:"𝄌"};
    if (!labels[this.data.marker]) return;
    const marker = document.createElement("span");
    marker.className = "tab-marker";
    marker.textContent = labels[this.data.marker];
    box.appendChild(marker);
  }

  renderBelowAnnotation(box) {
    if (!this.data.belowRight) return;
    const below = document.createElement("span");
    below.className = "tab-below";
    below.innerHTML = this.renderBelow(this.data.belowRight);
    box.appendChild(below);
  }
}

/* RENDERER: ChordDiagramRenderer */
class ChordDiagramRenderer {
  static render(chord, fallbackStartFret = 1) {
    const startFret = chord.startFret || fallbackStartFret || 1;
    const visibleFrets = 5;
    const dotFrets = new Set([3, 5, 7, 9, 12, 15, 17]);
    const el = document.createElement("div");
    el.className = chord.missing ? "chord chord-missing" : "chord";
    el.dataset.renderer = "ChordDiagramRenderer";
    el.innerHTML = `<div class="chord-title">${FretFlow.escape(chord.name || "")}</div>`;
    if (chord.missing) {
      el.innerHTML += `<div class="chord-missing-message">Akkoord niet gevonden</div>`;
      return el;
    }
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 100 132");
    const stringXs = [18, 31, 44, 57, 70, 83];
    const topY = 24, fretGap = 17, leftX = 18, rightX = 83;
    let markup = `<line x1="${leftX}" y1="${topY}" x2="${rightX}" y2="${topY}" stroke="#111" stroke-width="3"/>`;
    if (startFret > 1) markup += `<text x="8" y="${topY + fretGap/2 + 3}" font-size="9" font-weight="700" text-anchor="middle" fill="#333">${startFret}</text>`;
    markup += stringXs.map(x => `<line x1="${x}" y1="${topY}" x2="${x}" y2="${topY + visibleFrets * fretGap}" stroke="#666" stroke-width="1"/>`).join("");
    for (let i=1;i<=visibleFrets;i++) {
      const y = topY + i * fretGap;
      markup += `<line x1="${leftX}" y1="${y}" x2="${rightX}" y2="${y}" stroke="#b8b8b8" stroke-width="1"/>`;
      const actualFret = startFret + i - 1;
      if (dotFrets.has(actualFret)) markup += `<text x="9" y="${y - fretGap/2 + 3}" font-size="8" text-anchor="middle" fill="#555">${actualFret}</text>`;
    }
    (chord.frets || []).forEach((f,i) => {
      const x=stringXs[i];
      if (f === "x") markup += `<text x="${x}" y="14" font-size="9" font-weight="700" text-anchor="middle">x</text>`;
      else if (f === 0) markup += `<text x="${x}" y="14" font-size="9" font-weight="700" text-anchor="middle">o</text>`;
    });
    (chord.frets || []).forEach((f,i) => {
      if (typeof f !== "number" || f === 0) return;
      const rel=f-startFret+1; if(rel<1||rel>visibleFrets)return;
      const x=stringXs[i], y=topY+(rel-.5)*fretGap, finger=Array.isArray(chord.fingers)?chord.fingers[i]:null;
      markup += `<circle cx="${x}" cy="${y}" r="5.8" fill="#111"/>`;
      if (finger != null && finger !== "") markup += `<text x="${x}" y="${y}" font-size="7" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#fff">${FretFlow.escape(finger)}</text>`;
    });
    (chord.barres || []).forEach(barre => {
      const fret=Number(barre.fret), from=Math.max(0,Math.min(5,Number(barre.fromString??0))), to=Math.max(0,Math.min(5,Number(barre.toString??5))), rel=fret-startFret+1;
      if(!Number.isFinite(fret)||rel<1||rel>visibleFrets)return;
      const y=topY+(rel-.5)*fretGap, x1=stringXs[Math.min(from,to)], x2=stringXs[Math.max(from,to)];
      markup += `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#111" stroke-width="11.6" stroke-linecap="round"/>`;
      if(barre.finger!=null&&barre.finger!=="") markup += `<text x="${(x1+x2)/2}" y="${y}" font-size="7" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#fff">${FretFlow.escape(barre.finger)}</text>`;
    });
    svg.innerHTML=markup; el.appendChild(svg); return el;
  }
}

/* COMPONENT: ChordGridComponent */
class ChordGridComponent extends Component {
  static UNITS = Layout.CHORDGRID_UNITS;
  render() {
    const wrap = document.createElement("div");
    wrap.className = "music-component component-block chordgrid-block";
    wrap.innerHTML = `<h2 class="component-title">${FretFlow.escape(this.data.title || "")}</h2><div class="chord-grid"></div>`;
    const grid = wrap.querySelector(".chord-grid");
    const chordMap = FretFlow.chordMap(this.app.data.library || {});
    (this.data.chords || []).forEach(code => {
      const entry = chordMap.get(code);
      const chord = entry ? {name:entry.code, ...entry.diagram} : {name:code, missing:true};
      if (!entry) console.warn(`Unknown chord code: ${code}`);
      grid.appendChild(ChordDiagramRenderer.render(chord));
    });
    return this.applyLayoutUnits(wrap);
  }
}

FretFlow.renderNativeRecord = function(record, libraryData = {}) {
  const data = {
    app: { title: "FretFlow Preview", subtitle: "" },
    groups: {songs:{title:"Liedjes"},exercises:{title:"Oefeningen"},cheatsheets:{title:"Cheat sheets"},developer:{title:"Developer"}},
    library: {
      frets: libraryData.frets || Array.from({length:17}, (_,i)=>i+1),
      strings: libraryData.strings || ["Hoge E","B","G","D","A","Dikke E"],
      rootsA: libraryData.rootsA || [],
      rootsC: libraryData.rootsC || [],
      chordCategories: libraryData.chordCategories || FretFlow.defaultChordCategories(),
      chords: libraryData.chords || []
    },
    tabs: [record]
  };
  const app = Object.create(FretFlowApp.prototype);
  app.data = FretFlow.normalizeNativeData(data);
  app.frets = data.library.frets;
  app.strings = data.library.strings;
  app.rootsA = new Set(data.library.rootsA);
  app.rootsC = new Set(data.library.rootsC);
  app.pdfDocuments = new Map();
  app.chordLibraryCategory = "";
  app.chordLibraryRenderer = new ChordLibraryRenderer(app);
  app.pent = {
    0:[5,8,10,12,15,17], 1:[5,8,10,13,15,17], 2:[5,7,9,12,14,17],
    3:[5,7,10,12,14,17], 4:[5,7,10,12,15,17], 5:[5,8,10,12,15,17]
  };
  const mount = document.createElement("div");
  mount.className = "builder-record-preview";
  const pages = app.paginate(record);
  pages.forEach((components, index) => {
    const shell = document.createElement("div");
    shell.className = "page-shell";
    shell.appendChild(app.renderPage(record, components, index, pages.length));
    mount.appendChild(shell);
  });
  return mount;
};

FretFlow.renderChordPreview = function(entry) {
  const mount = document.createElement("div");
  mount.className = "chord-editor-preview";
  const chord = entry ? {name:entry.code || "Nieuw akkoord", ...(entry.diagram || {})} : {name:"Nieuw akkoord", frets:["x","x","x","x","x","x"]};
  mount.appendChild(ChordDiagramRenderer.render(chord));

};

FretFlow.renderChordLibraryPreview = function(libraryData = {}) {
  const app = Object.create(FretFlowApp.prototype);
  app.data = FretFlow.normalizeNativeData({library:JSON.parse(JSON.stringify(libraryData)), tabs:[]});
  app.chordLibraryCategory = "";
  app.chordLibraryRenderer = new ChordLibraryRenderer(app);
  const mount = document.createElement("div");
  mount.className = "builder-record-preview";
  const pages = app.chordLibraryRenderer.pages();
  pages.forEach((pageData,index) => {
    const shell = document.createElement("div"); shell.className = "page-shell";
    shell.appendChild(app.chordLibraryRenderer.renderPage(pageData,index,pages.length));
    mount.appendChild(shell);
  });
  return mount;
};

FretFlow.renderPdfRecordPreview = async function(record) {
  const mount = document.createElement("div");
  mount.className = "builder-record-preview";
  const embeddedId = record.embeddedId || record.id;
  const tab = {
    id:record.id,
    nr:record.nr || "",
    title:record.title || "PDF",
    artist:record.artist || "",
    tags:record.tags || [],
    description:record.description || "",
    footer:record.footer || "",
    groups:record.groups || [],
    source:{type:"pdf",embeddedId,pageCount:Math.max(1,Number(record.pageCount)||1)},
    sections:[],legend:[]
  };

  const app = Object.create(FretFlowApp.prototype);
  app.pdfDocuments = new Map();
  app.pdfRecords = new Map([[embeddedId, record]]);
  app.allowDetachedPdfRender = true;

  if (record.data && window.pdfjsLib) {
    try {
      const pdf = await app.getPdfDocument(tab);
      record.pageCount = pdf.numPages;
      tab.source.pageCount = pdf.numPages;
    } catch (error) {
      // Keep the shared page renderer responsible for the visible error state.
    }
  }

  const pages = app.paginate(tab);
  pages.forEach((pageData,index) => {
    const shell = document.createElement("div");
    shell.className = "page-shell";
    shell.appendChild(app.renderPage(tab,pageData,index,pages.length));
    mount.appendChild(shell);
  });
  return mount;
};
