<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="100" height="100"
     viewBox="0 0 100 100">
  <defs>
    <radialGradient id="faceGradient" cx="37%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#565961"/>
      <stop offset="55%" stop-color="#36383e"/>
      <stop offset="100%" stop-color="#202126"/>
    </radialGradient>
    <linearGradient id="rimGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#50535a"/>
      <stop offset="50%" stop-color="#292b30"/>
      <stop offset="100%" stop-color="#15161a"/>
    </linearGradient>
  </defs>

  <!-- Static min/max ticks -->
  <g fill="none" stroke="#f5f5f5" stroke-width="4.2" stroke-linecap="round">
    <line x1="31" y1="76" x2="27" y2="82"/>
    <line x1="69" y1="76" x2="73" y2="82"/>
  </g>

  <!-- Static knob body -->
  <circle cx="50" cy="48" r="29" fill="url(#rimGradient)"/>
  <circle cx="50" cy="48" r="25.5" fill="url(#faceGradient)"/>
  <path d="M31 35 C38 23, 57 18, 69 28"
        fill="none" stroke="#74777f" stroke-width="2.2"
        stroke-linecap="round" opacity=".28"/>
  <path d="M32 64 C40 72, 58 75, 69 66"
        fill="none" stroke="#0f1013" stroke-width="3"
        stroke-linecap="round" opacity=".45"/>

  <!-- Only this group should rotate -->
  <g id="pointer" transform="rotate(0 50 48)">
    <line x1="50" y1="47" x2="50" y2="26"
          stroke="#f7f7f7" stroke-width="5"
          stroke-linecap="round"/>
  </g>
</svg>
